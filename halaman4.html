<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Moment Foto</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url(—Pngtree—happy\ halloween\ flyer_15560411.png) no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding-top: 80px;
      color: white;
    }

    nav {
      background: url(MuchaTseBle.jpeg);
      padding: 15px 30px;
      position: fixed;
      width: 100%;
      top: 0;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 1000;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffcc00;
    }

    .konten {
      max-width: 900px;
      margin: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .gallery img {
      width: 250px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="halaman1.html">Home</a>
    <a href="halaman2.html">Order Joki</a>
    <a href="halaman3.html">Arsipan Turnamen</a>
  </nav>

  <!-- Konten Galeri -->
  <div class="konten">
    <h1>Moment-Moment Turnamen Mobile Legend</h1>
    <p>Kenangan terbaik saat menang turnamen dengan prizepool besar.</p>

    <div class="gallery">
      <img src="suah.jpg" alt="Arsipan Turnamen 1">
      <img src="duo.jpg" alt="Arsipan Turnamen 2">
      <img src="tigo.jpg" alt="Arsipan Turnamen 3">
      <img src="empek.jpg" alt="Arsipan Turnamen 4">
      <img src="limo.jpg" alt="Arsipan Turnamen 5">
    </div>
  </div>

</body>
</html>
